<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tiền - Làng Hoa Rực</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/logo/ChatGPT Image 13_27_39 3 thg 9, 2025.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            color: #333;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn i {
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .back-btn:active {
            transform: translateY(0);
        }

        .recharge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .recharge-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .recharge-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .recharge-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin-right: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .package-list {
            margin: 20px 0;
        }

        .package-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .package-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .package-item.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .package-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .package-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .package-details h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .package-details p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .package-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #28a745;
        }

        .package-item.selected .package-price {
            color: white;
        }

        .payment-methods {
            margin-top: 30px;
        }

        .payment-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .payment-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .payment-method {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            border: 3px solid #1f4e79;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #1f4e79, #2c5aa0);
            color: white;
            font-weight: 600;
            min-width: 200px;
            justify-content: center;
        }

        .payment-method:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(31, 78, 121, 0.3);
        }

        .payment-method.selected {
            border-color: #1f4e79;
            background: linear-gradient(135deg, #1f4e79, #2c5aa0);
            box-shadow: 0 5px 15px rgba(31, 78, 121, 0.4);
        }

        .payment-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-right: 15px;
        }

        .payment-name {
            font-weight: 500;
        }

        .recharge-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .recharge-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .recharge-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-steps {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .steps-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .steps-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            background: #e9ecef;
            z-index: 1;
            transition: all 0.5s ease;
        }

        .progress-line {
            position: absolute;
            top: 50%;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            z-index: 2;
            transition: all 0.8s ease;
            transform: translateY(-50%);
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            background: white;
            padding: 0 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .step:hover {
            transform: translateY(-2px);
        }

        .step.active {
            animation: slideIn 0.5s ease-out;
        }

        .step-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .step-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .step-circle:hover::before {
            width: 100%;
            height: 100%;
        }

        .step-circle.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            animation: pulse 2s infinite;
        }

        .step-circle.completed {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            animation: checkmark 0.6s ease-in-out;
        }

        .step-circle.pending {
            background: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
        }

        .step-circle.pending:hover {
            transform: scale(1.05);
            background: #dee2e6;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            }
            50% {
                box-shadow: 0 5px 25px rgba(102, 126, 234, 0.5);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            }
        }

        @keyframes checkmark {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-title {
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            color: #333;
        }

        .step.active .step-title {
            color: #667eea;
            font-weight: 600;
        }

        .step.completed .step-title {
            color: #28a745;
        }

        .step.pending .step-title {
            color: #6c757d;
        }

        .user-info {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            color: #333;
        }

        .user-info h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .recharge-grid {
                grid-template-columns: 1fr;
            }
            
            .back-btn {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 20px;
            }

            .progress-steps {
                padding: 20px;
            }

            .steps-container {
                flex-direction: column;
                gap: 20px;
            }

            .steps-container::before {
                display: none;
            }

            .step {
                flex-direction: row;
                padding: 15px;
                background: #f8f9fa;
                border-radius: 10px;
                width: 100%;
                justify-content: flex-start;
            }

            .step-circle {
                margin-bottom: 0;
                margin-right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .step-title {
                font-size: 1rem;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- VNPay Payment Form (Hidden) -->

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            once: true
        });

        // Go back function - FIXED VERSION
        function goBack() {
            console.log('🔄 Going back to index.html...');
            
            // Force redirect to index.html
            window.location.href = 'index.html';
        }
        
        // Make goBack globally available
        window.goBack = goBack;

        // Progress Steps Management
        function updateProgressStep(stepNumber) {
            // Reset all steps
            for (let i = 1; i <= 3; i++) {
                const step = document.getElementById(`step${i}`);
                const circle = step.querySelector('.step-circle');
                const title = step.querySelector('.step-title');
                
                step.className = 'step';
                circle.className = 'step-circle';
                title.className = 'step-title';
            }
            
            // Update steps based on current step
            for (let i = 1; i <= stepNumber; i++) {
                const step = document.getElementById(`step${i}`);
                const circle = step.querySelector('.step-circle');
                const title = step.querySelector('.step-title');
                
                if (i < stepNumber) {
                    // Completed steps
                    step.className = 'step completed';
                    circle.className = 'step-circle completed';
                    title.className = 'step-title';
                } else if (i === stepNumber) {
                    // Current active step
                    step.className = 'step active';
                    circle.className = 'step-circle active';
                    title.className = 'step-title';
                } else {
                    // Pending steps
                    step.className = 'step pending';
                    circle.className = 'step-circle pending';
                    title.className = 'step-title';
                }
            }
            
            // Update progress line
            updateProgressLine(stepNumber);
        }

        // Update progress line animation
        function updateProgressLine(stepNumber) {
            const progressLine = document.getElementById('progressLine');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');
            
            const step1Rect = step1.getBoundingClientRect();
            const containerRect = document.querySelector('.steps-container').getBoundingClientRect();
            
            let progressWidth = 0;
            
            if (stepNumber >= 2) {
                const step2Rect = step2.getBoundingClientRect();
                progressWidth = (step2Rect.left + step2Rect.width/2) - (step1Rect.left + step1Rect.width/2);
            }
            
            if (stepNumber >= 3) {
                const step3Rect = step3.getBoundingClientRect();
                progressWidth = (step3Rect.left + step3Rect.width/2) - (step1Rect.left + step1Rect.width/2);
            }
            
            progressLine.style.width = progressWidth + 'px';
        }

        // Add click effects
        function addStepClickEffects() {
            for (let i = 1; i <= 3; i++) {
                const step = document.getElementById(`step${i}`);
                step.addEventListener('click', function() {
                    // Add ripple effect
                    const ripple = document.createElement('div');
                    ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(102, 126, 234, 0.3);
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        pointer-events: none;
                        width: 100px;
                        height: 100px;
                        left: 50%;
                        top: 50%;
                        margin-left: -50px;
                        margin-top: -50px;
                    `;
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            }
        }

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize progress steps
        function initializeProgressSteps() {
            updateProgressStep(1); // Start with step 1
            addStepClickEffects(); // Add click effects
        }

        // Sample packages data
        const SAMPLE_PACKAGES = {
            diamond: [
                { id: 1, name: 'Gói Kim Cương Nhỏ', description: '100 Kim Cương', price: 10000, currency: 'VND', type: 'diamond' },
                { id: 2, name: 'Gói Kim Cương Trung', description: '500 Kim Cương + 50 Bonus', price: 50000, currency: 'VND', type: 'diamond' },
                { id: 3, name: 'Gói Kim Cương Lớn', description: '1000 Kim Cương + 200 Bonus', price: 100000, currency: 'VND', type: 'diamond' },
                { id: 4, name: 'Gói Kim Cương VIP', description: '2000 Kim Cương + 500 Bonus', price: 200000, currency: 'VND', type: 'diamond' }
            ],
            gold: [
                { id: 5, name: 'Gói Vàng Nhỏ', description: '10,000 Vàng', price: 5000, currency: 'VND', type: 'gold' },

        // Sync localStorage data to Firebase
        async function syncLocalStorageToFirebase(gold, diamond, userId) {
            try {

                const userUrl = `${firebaseUrl}/Users/${userId}.json`;
                
                // Get current user data

                // Calculate new values

                const currentDiamond = parseInt(currentData.Diamond) || 0;
                const newGold = currentGold + gold;
                const newDiamond = currentDiamond + diamond;
                
                // Update Firebase
                await fetch(userUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        Gold: newGold,
                        Diamond: newDiamond,
                        LastSync: new Date().toISOString()
                    })
                });
                
                console.log('✅ Data synced to Firebase:', {
                    oldGold: currentGold,
                    newGold: newGold,
                    oldDiamond: currentDiamond,
                    newDiamond: newDiamond
                });
                
                // Clear localStorage after sync
                localStorage.removeItem('userGold');
                localStorage.removeItem('userDiamond');
                
            } catch (error) {
                console.error('❌ Error syncing to Firebase:', error);

        function createSecureHash(params) {
            // Lọc bỏ các tham số rỗng và null
            const filteredParams = {};
            Object.keys(params).forEach(key => {
                const value = params[key];
                if (value !== '' && value !== null && value !== undefined) {
                    filteredParams[key] = value;
                }
            });

            // Sắp xếp tham số theo thứ tự bảng chữ cái
            const sortedKeys = Object.keys(filteredParams).sort();

            // Tạo chuỗi ký tự cần mã hóa (theo chuẩn VNPay)
            const signData = sortedKeys
                .map(key => `${key}=${filteredParams[key]}`)
                .join('&');

            console.log('=== VNPAY HASH DEBUG ===');
            console.log('Filtered params:', filteredParams);
            console.log('Sorted keys:', sortedKeys);
            console.log('Sign data:', signData);
            console.log('Secret key length:', VNPAY_CONFIG.hashSecret.length);
            console.log('========================');
            
            // Tạo chữ ký theo chuẩn VNPay với HMAC-SHA512
            if (typeof CryptoJS !== 'undefined') {
                try {
                const hmac = CryptoJS.HmacSHA512(signData, VNPAY_CONFIG.hashSecret);
                    const secureHash = hmac.toString(CryptoJS.enc.Hex).toUpperCase();
                console.log('Generated hash:', secureHash);
                    console.log('Hash length:', secureHash.length);
                return secureHash;
                } catch (error) {
                    console.error('Error creating HMAC:', error);
                    throw new Error('Failed to create secure hash');
                }
            } else {
                throw new Error('CryptoJS not available');
            }
        }

        // Parse package data to extract amounts
        function parsePackageData(packageData) {
            console.log('🔍 Parsing package data:', packageData);
            
            let amount = 0;
            let bonus = 0;
            let diamond = 0;
            let diamondBonus = 0;
            
            if (packageData.type === 'gold') {
                // Parse gold packages
                const description = packageData.description;
                console.log('💰 Parsing gold package:', description);
                
                // Extract main amount (before +)
                const mainMatch = description.match(/(\d{1,3}(?:,\d{3})*)\s*Vàng/);
                if (mainMatch) {
                    amount = parseInt(mainMatch[1].replace(/,/g, ''));
                    console.log('💰 Main gold amount:', amount);
                }
                
                // Extract bonus amount
                const bonusMatch = description.match(/(\d{1,3}(?:,\d{3})*)\s*Bonus/);
                if (bonusMatch) {
                    bonus = parseInt(bonusMatch[1].replace(/,/g, ''));
                    console.log('💰 Bonus gold amount:', bonus);
                }
                
            } else if (packageData.type === 'diamond') {
                // Parse diamond packages
                const description = packageData.description;
                console.log('💎 Parsing diamond package:', description);
                
                // Extract main amount (before +)
                const mainMatch = description.match(/(\d+)\s*Kim Cương/);
                if (mainMatch) {
                    diamond = parseInt(mainMatch[1]);
                    console.log('💎 Main diamond amount:', diamond);
                }
                
                // Extract bonus amount
                const bonusMatch = description.match(/(\d+)\s*Bonus/);
                if (bonusMatch) {
                    diamondBonus = parseInt(bonusMatch[1]);
                    console.log('💎 Bonus diamond amount:', diamondBonus);
                }
            }
            
            const result = {
                amount,
                bonus,
                diamond,
                diamondBonus
            };
            
            console.log('✅ Parsed package data result:', result);
            console.log('🔍 Debug info:', {
                packageType: packageData.type,
                description: packageData.description,
                mainMatch: packageData.type === 'gold' ? 
                    packageData.description.match(/(\d{1,3}(?:,\d{3})*)\s*Vàng/) :
                    packageData.description.match(/(\d+)\s*Kim Cương/),
                bonusMatch: packageData.description.match(/(\d+)\s*Bonus/)
            });
            return result;
        }

        // Wait for Firebase to be ready (simplified for REST API)
        async function waitForFirebase(maxRetries = 5, delay = 500) {
            for (let i = 0; i < maxRetries; i++) {
                console.log('⏳ Checking Firebase availability...', i + 1, '/', maxRetries);
                console.log('  - window.auth:', typeof window.auth !== 'undefined' ? 'YES' : 'NO');
                
                if (typeof window.auth !== 'undefined') {
                    console.log('✅ Firebase is ready after', (i + 1) * delay, 'ms');
                    console.log('👤 Auth object available:', window.auth ? 'YES' : 'NO');
                    console.log('🔑 Current user:', window.auth.currentUser ? window.auth.currentUser.uid : 'NOT LOGGED IN');
                    return true;
                }
                console.log('⏳ Waiting for Firebase...', i + 1, '/', maxRetries);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            console.log('❌ Firebase not ready after', maxRetries * delay, 'ms');
            return false;
        }

                vnp_TransactionStatus,

            console.log('👤 Auth current user:', typeof window.auth !== 'undefined' ? window.auth.currentUser : 'auth not defined');

                        console.error('❌ Error updating Firebase transaction:', error);
                    }
                } else if (vnp_TxnRef && !firebaseReady) {
                    console.log('⚠️ Firebase not ready, skipping Firebase update for failed transaction');
                }
                
                Swal.fire({
                    title: 'Thanh toán thất bại!',
                    html: `
                        <div style="text-align: left;">
                            <p><strong>Mã lỗi:</strong> ${vnp_ResponseCode}</p>
                            <p><strong>Lý do:</strong> ${errorMessage}</p>
                            <p><strong>Mã giao dịch:</strong> ${vnp_TxnRef || 'N/A'}</p>
                        </div>
                    `,
                    icon: 'error',
                    confirmButtonText: 'Thử lại'
                }).then(() => {
                    updateProgressStep(1);
                    // Clear localStorage
                    localStorage.removeItem('pendingPackage');
                    localStorage.removeItem('vnpayTxnRef');
                    // Clear URL parameters
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }
        }

        // Demo functions to test animations
        function demoStep1() {
            updateProgressStep(1);
        }

        function demoStep2() {
            updateProgressStep(2);
        }

        function demoStep3() {
            updateProgressStep(3);
        }



        // Test VNPay integration without errors

        // Enhanced VNPay error handling
        (function() {
            // Store original error handlers
            const originalError = window.onerror;
            const originalUnhandledRejection = window.onunhandledrejection;
            
            // Override window.onerror
            window.onerror = function(message, source, lineno, colno, error) {
                if (message && (
                    message.includes('timer is not defined') ||
                    message.includes('Content-Security-Policy') ||
                    (source && source.includes('vnpayment.vn'))
                )) {
                    console.warn('🚫 VNPay error filtered:', message);
                    return true; // Prevent default error handling
                }
                if (originalError) {
                    return originalError.call(this, message, source, lineno, colno, error);
                }
                return false;
            };
            
            // Override window.onunhandledrejection
            window.onunhandledrejection = function(event) {
                if (event.reason && event.reason.message && (
                    event.reason.message.includes('timer is not defined') ||
                    event.reason.message.includes('Content-Security-Policy')
                )) {
                    console.warn('🚫 VNPay promise rejection filtered:', event.reason.message);
                    event.preventDefault();
                    return true;
                }
                if (originalUnhandledRejection) {
                    return originalUnhandledRejection.call(this, event);
                }
                return false;
            };
        })();

        // Override console methods to filter VNPay errors
        (function() {
            const originalConsoleError = console.error;
            const originalConsoleWarn = console.warn;
            
            console.error = function(...args) {
                const message = args.join(' ');
                if (message.includes('timer is not defined') || 
                    message.includes('Content-Security-Policy') ||
                    message.includes('vnpayment.vn') ||
                    message.includes('jquery.bundles.js')) {
                    console.warn('🚫 VNPay error filtered:', message);
                    return;
                }
                originalConsoleError.apply(console, args);
            };
            
            console.warn = function(...args) {
                const message = args.join(' ');
                if (message.includes('Content-Security-Policy')) {
                    console.log('🚫 VNPay CSP warning filtered:', message);
                    return;
                }
                originalConsoleWarn.apply(console, args);
            };
        })();

        // Add global error handler for VNPay iframe
        window.addEventListener('message', function(e) {
            if (e.origin && e.origin.includes('vnpayment.vn')) {
                console.log('📨 VNPay message received:', e.data);
            }
        });

        // Add error boundary for VNPay
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('vnpayment.vn')) {
                console.warn('🚫 VNPay script error filtered:', e.message);
                e.preventDefault();
                return true;
            }
        });

        // Add user notification for VNPay errors
        function showVNPayErrorNotification() {
            // Only show once per session
            if (sessionStorage.getItem('vnpay_error_shown')) {
                return;
            }
            
            sessionStorage.setItem('vnpay_error_shown', 'true');
            
            // Show notification after 2 seconds
            setTimeout(() => {
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        title: 'Thông báo',
                        html: `
                            <div style="text-align: left;">
                                <p><strong>Lưu ý:</strong> Có thể xuất hiện một số lỗi JavaScript từ VNPay</p>
                                <p>Đây là lỗi từ phía VNPay, không ảnh hưởng đến chức năng thanh toán</p>
                                <p>Bạn có thể bỏ qua các lỗi này và tiếp tục sử dụng bình thường</p>
                            </div>
                        `,
                        icon: 'info',
                        confirmButtonText: 'Đã hiểu',
                        timer: 10000,
                        timerProgressBar: true
                    });
                }
            }, 2000);
        }

        // Show notification if VNPay errors are detected
        setTimeout(() => {
            showVNPayErrorNotification();
        }, 5000);

        // VNPay Transaction Lookup Function
        function lookupVNPayTransaction(transactionId) {
            console.log('🔍 Looking up VNPay transaction:', transactionId);
            
            // Check localStorage for pending transactions
            const pendingPackage = localStorage.getItem('pendingPackage');
            const vnpayTxnRef = localStorage.getItem('vnpayTxnRef');
            
            if (vnpayTxnRef === transactionId) {
                console.log('✅ Found matching transaction in localStorage');
                console.log('Package:', pendingPackage ? JSON.parse(pendingPackage) : 'N/A');
                return {
                    found: true,
                    source: 'localStorage',
                    package: pendingPackage ? JSON.parse(pendingPackage) : null
                };
            }
            
            // Check Firebase if available
            if (typeof firebase !== 'undefined') {
                try {
                    const firebaseRTDB = firebase.database();
                    const transactionRef = firebaseRTDB.ref('vnpay_transactions/' + transactionId);
                    transactionRef.once('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            console.log('✅ Found transaction in Firebase:', data);
                            return {
                                found: true,
                                source: 'firebase',
                                data: data
                            };
                        }
                    });
                } catch (error) {
                    console.error('Error checking Firebase:', error);
                }
            }
            
            return { found: false };
        }

        // Auto-lookup transaction if URL contains transaction info
        function autoLookupTransaction() {
            const urlParams = new URLSearchParams(window.location.search);
            const vnp_TxnRef = urlParams.get('vnp_TxnRef');
            const vnp_ResponseCode = urlParams.get('vnp_ResponseCode');
            
            if (vnp_TxnRef) {
                console.log('🔍 Auto-lookup transaction:', vnp_TxnRef);
                const result = lookupVNPayTransaction(vnp_TxnRef);
                
                if (result.found) {
                    console.log('✅ Transaction found:', result);
                } else {
                    console.log('❌ Transaction not found in local storage');
                }
            }
        }

        // Run auto-lookup on page load
        setTimeout(() => {
            autoLookupTransaction();
        }, 2000);

        // Manual lookup function for testing
        window.lookupTransaction = function(transactionId) {
            return lookupVNPayTransaction(transactionId);
        };



    </script>
